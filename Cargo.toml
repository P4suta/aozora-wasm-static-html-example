[package]
name = "aozora-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0 OR MIT"

[[bin]]
name = "lab"
path = "rust/main.rs"

[[bin]]
name = "xtask"
path = "rust/xtask.rs"

[lib]
path = "rust/lib.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.3", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tar = "=0.4.46"
url = "=2.5.8"

[dev-dependencies]
pretty_assertions = "=1.4.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
